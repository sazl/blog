  .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

    position: sticky;
    top: 60px;
    z-index: 50;
  }
  .search-input {
    width: 100%;
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: 6px;
    padding: 12px 15px;
    color: var(--color-text);
    font-family: inherit;
    font-size: 1rem;
    outline: none;
  }
  .search-input:focus { border-color: var(--color-accent); }
  .search-input::placeholder { color: var(--color-text-dimmest); }
  .filter-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 15px;
  }
  .filter-btn {
    background: var(--color-border-light);
    color: var(--color-text-muted);
    border: 1px solid var(--color-border);
    padding: 6px 12px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover { background: var(--color-border); color: #fff; }
  .filter-btn.active { background: var(--color-accent); color: #000; border-color: var(--color-accent); }
  .results-count { color: var(--color-text-dimmer); font-size: 0.85rem; margin: 15px 0; }
  .engine-section { margin-bottom: 30px; }
  .engine-title {
    color: var(--color-accent);
    font-size: 1.2rem;
    margin: 0 0 15px 0;
    padding: 10px 0;
    border-bottom: 1px solid var(--color-border);
  }
  .param-table { width: 100%; border-collapse: collapse; }
  .param-table th {
    text-align: left;
    color: var(--color-text-dimmer);
    font-weight: normal;
    font-size: 0.75rem;
    text-transform: uppercase;
    padding: 10px;
    border-bottom: 1px solid #333;
    position: sticky;
    top: 150px;
    background: #0a0a0a;
  }
  .param-table td {
    padding: 10px;
    border-bottom: 1px solid #1a1a1a;
    vertical-align: top;
  }
  .param-table tr:hover { background: #151515; }
  .param-table tr.hidden { display: none; }
  .param-name { color: #00ff88; font-weight: bold; }
  .param-type { color: #61afef; font-size: 0.85rem; }
  .param-range { color: #d19a66; font-size: 0.85rem; }
  .param-default { color: #888; font-size: 0.85rem; }
  .param-desc { color: #aaa; font-size: 0.85rem; }
  .highlight { background: #00ff8833; }
  .param-anchor {
    color: #444;
    text-decoration: none;
    margin-right: 6px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .param-table tr:hover .param-anchor { opacity: 1; }
  .param-anchor:hover { color: #00ff88; }
  .param-table tr {
    scroll-margin-top: 180px;
  }
  .param-table tr:target {
    background: #00ff8822;
    animation: highlight-fade 2s ease-out;
  }
  .param-table tr:target .param-name { color: #00ff88; }
  @keyframes highlight-fade {
    0% { background: #00ff8844; }
    100% { background: #00ff8822; }
  }
  @media (max-width: 768px) {
    .param-table th:nth-child(4),
    .param-table td:nth-child(4) { display: none; }
  }
</style>

    { engine: 'fold', name: 'harmonicEmphasis', type: 'number', range: '0-1', default: '0.5', desc: 'Harmonic emphasis' },
    { engine: 'fold', name: 'antiAliasQuality', type: 'number', range: '0-1', default: '0.8', desc: 'Anti-aliasing quality' },
    { engine: 'fold', name: 'modOscFreq', type: 'number', range: '0.1-10 ratio', default: '1', desc: 'Modulator frequency ratio' },
    { engine: 'fold', name: 'modAmt', type: 'number', range: '0-1', default: '0', desc: 'Modulation amount' },
    { engine: 'fold', name: 'noiseInjection', type: 'number', range: '0-1', default: '0', desc: 'Noise injection amount' },
    { engine: 'fold', name: 'partialSpread', type: 'number', range: '0-1', default: '0', desc: 'Partial spread' },
    { engine: 'fold', name: 'vcfMode', type: 'enum', range: 'hp|bp|lp', default: 'lp', desc: 'Filter mode' },
    { engine: 'fold', name: 'cutoff', type: 'number', range: '100-15000 Hz', default: '5000', desc: 'Filter cutoff' },
    { engine: 'fold', name: 'filterRes', type: 'number', range: '0-1', default: '0.2', desc: 'Filter resonance' },
    { engine: 'fold', name: 'driveAmt', type: 'number', range: '0-1', default: '0.2', desc: 'Drive amount' },
    { engine: 'fold', name: 'driveMix', type: 'number', range: '0-1', default: '0.5', desc: 'Drive wet/dry mix' },

    // Impact Parameters
    { engine: 'impact', name: 'transient.type', type: 'enum', range: 'impulse|click|brush|mallet|noise-burst', default: 'noise-burst', desc: 'Transient attack type' },
    { engine: 'impact', name: 'transient.pitch', type: 'number', range: '100-2000 Hz', default: '800', desc: 'Transient pitch (for click/mallet)' },
    { engine: 'impact', name: 'transient.brightness', type: 'number', range: '0-1', default: '0.5', desc: 'Transient brightness' },
    { engine: 'impact', name: 'transient.level', type: 'number', range: '0-1', default: '0.6', desc: 'Transient layer level' },
    { engine: 'impact', name: 'transient.length', type: 'number', range: '0.01-0.2 sec', default: '0.05', desc: 'Transient duration' },
    { engine: 'impact', name: 'body.type', type: 'enum', range: 'sine|triangle|noise|filtered-noise|resonant', default: 'sine', desc: 'Body layer type' },
    { engine: 'impact', name: 'body.pitch', type: 'number', range: '40-1000 Hz', default: '150', desc: 'Body pitch' },
    { engine: 'impact', name: 'body.decay', type: 'number', range: '0.05-2 sec', default: '0.3', desc: 'Body decay time' },
    { engine: 'impact', name: 'body.filterCutoff', type: 'number', range: '100-10000 Hz', default: '2000', desc: 'Body filter cutoff' },
    { engine: 'impact', name: 'body.filterRes', type: 'number', range: '0-1', default: '0.3', desc: 'Body filter resonance' },
    { engine: 'impact', name: 'body.level', type: 'number', range: '0-1', default: '0.7', desc: 'Body layer level' },
    { engine: 'impact', name: 'tail.type', type: 'enum', range: 'noise-tail|reverb-like|shimmer|damped|tonal', default: 'noise-tail', desc: 'Tail layer type' },
    { engine: 'impact', name: 'tail.decay', type: 'number', range: '0.1-3 sec', default: '0.5', desc: 'Tail decay time' },
    { engine: 'impact', name: 'tail.color', type: 'number', range: '0-1', default: '0.5', desc: 'Tail color (dark to bright)' },
    { engine: 'impact', name: 'tail.level', type: 'number', range: '0-1', default: '0.4', desc: 'Tail layer level' },
    { engine: 'impact', name: 'layerMix', type: 'number', range: '0-1', default: '0.6', desc: 'Body vs tail balance' },
    { engine: 'impact', name: 'overallDecay', type: 'number', range: '0.1-3', default: '1', desc: 'Overall decay multiplier' },
    { engine: 'impact', name: 'hpfCutoff', type: 'number', range: '20-500 Hz', default: '40', desc: 'High-pass filter cutoff' },
    { engine: 'impact', name: 'lpfCutoff', type: 'number', range: '1000-20000 Hz', default: '15000', desc: 'Low-pass filter cutoff' },
    { engine: 'impact', name: 'filterRes', type: 'number', range: '0-1', default: '0', desc: 'Filter resonance' },
    { engine: 'impact', name: 'driveAmt', type: 'number', range: '0-1', default: '0', desc: 'Drive amount' },
    { engine: 'impact', name: 'driveType', type: 'enum', range: 'soft|hard|fold|tape', default: 'soft', desc: 'Drive type' },

    // FM Parameters
    { engine: 'fm', name: 'algorithm', type: 'number', range: '1-8', default: '1', desc: 'FM routing algorithm' },
    { engine: 'fm', name: 'modIndex', type: 'number', range: '0-10', default: '2', desc: 'Modulation index/depth' },
    { engine: 'fm', name: 'modIndexDecay', type: 'number', range: '0.01-0.5 sec', default: '0.1', desc: 'Mod index envelope decay' },
    { engine: 'fm', name: 'brightness', type: 'number', range: '0-1', default: '0.5', desc: 'Overall brightness' },
    { engine: 'fm', name: 'inharmonicityBias', type: 'number', range: '-1 to 1', default: '0', desc: 'Inharmonic detuning bias' },
    { engine: 'fm', name: 'op1.ratio', type: 'number', range: '0.5-16', default: '1', desc: 'Operator 1 frequency ratio' },
    { engine: 'fm', name: 'op1.level', type: 'number', range: '0-1', default: '1', desc: 'Operator 1 level' },
    { engine: 'fm', name: 'op1.decay', type: 'number', range: '0.01-2 sec', default: '0.3', desc: 'Operator 1 decay' },
    { engine: 'fm', name: 'op1.feedback', type: 'number', range: '0-1', default: '0', desc: 'Operator 1 feedback' },
    { engine: 'fm', name: 'op2.ratio', type: 'number', range: '0.5-16', default: '2', desc: 'Operator 2 frequency ratio' },
    { engine: 'fm', name: 'op2.level', type: 'number', range: '0-1', default: '0.5', desc: 'Operator 2 level' },
    { engine: 'fm', name: 'op2.decay', type: 'number', range: '0.01-2 sec', default: '0.1', desc: 'Operator 2 decay' },
    { engine: 'fm', name: 'op3.ratio', type: 'number', range: '0.5-16', default: '3', desc: 'Operator 3 frequency ratio' },
    { engine: 'fm', name: 'op3.level', type: 'number', range: '0-1', default: '0.3', desc: 'Operator 3 level' },
    { engine: 'fm', name: 'op4.ratio', type: 'number', range: '0.5-16', default: '4', desc: 'Operator 4 frequency ratio' },
    { engine: 'fm', name: 'op4.level', type: 'number', range: '0-1', default: '0.2', desc: 'Operator 4 level' },
    { engine: 'fm', name: 'hpfCutoff', type: 'number', range: '20-500 Hz', default: '20', desc: 'High-pass cutoff' },
    { engine: 'fm', name: 'lpfCutoff', type: 'number', range: '500-20000 Hz', default: '15000', desc: 'Low-pass cutoff' },
    { engine: 'fm', name: 'filterRes', type: 'number', range: '0-1', default: '0', desc: 'Filter resonance' },
    { engine: 'fm', name: 'driveAmt', type: 'number', range: '0-1', default: '0.1', desc: 'Drive amount' },
    { engine: 'fm', name: 'driveType', type: 'enum', range: 'soft|hard|fold', default: 'soft', desc: 'Drive type' },
  ];

  const ENGINE_NAMES = {
    'output': 'Output (All Engines)',
    'analog_kick': 'Analog Kick',
    'membrane': 'Dual Membrane',
    'hybrid_snare': 'Hybrid Snare',
    'clap': 'Clap',
    'hat': 'Hat',
    'cymbal': 'Cymbal',
    'tom': 'Tom/Conga',
    'rim': 'Rim/Clave',
    'shaker': 'Shaker',
    'fold': 'Fold/Wavetable',
    'impact': 'Impact',
    'fm': 'FM Perc'
  };

  let currentFilter = 'all';
  let searchQuery = '';

  function renderParameters() {
    const container = document.getElementById('parameterList');
    const resultsCount = document.getElementById('resultsCount');

    // Group by engine
    const grouped = {};
    let totalVisible = 0;

    PARAMETERS.forEach(param => {
      const matchesFilter = currentFilter === 'all' || param.engine === currentFilter;
      const matchesSearch = searchQuery === '' ||
        param.name.toLowerCase().includes(searchQuery) ||
        param.engine.toLowerCase().includes(searchQuery) ||
        param.desc.toLowerCase().includes(searchQuery);

      if (matchesFilter && matchesSearch) {
        if (!grouped[param.engine]) grouped[param.engine] = [];
        grouped[param.engine].push(param);
        totalVisible++;
      }
    });

    resultsCount.textContent = `Showing ${totalVisible} of ${PARAMETERS.length} parameters`;

    let html = '';
    for (const engine in grouped) {
      html += `
        <div class="engine-section">
          <h2 class="engine-title">${ENGINE_NAMES[engine] || engine}</h2>
          <table class="param-table">
            <thead>
              <tr>
                <th>Parameter</th>
                <th>Type</th>
                <th>Range</th>
                <th>Default</th>
                <th>Description</th>
              </tr>
            </thead>
            <tbody>
      `;

      grouped[engine].forEach(param => {
        const highlightName = searchQuery ? param.name.replace(new RegExp(`(${searchQuery})`, 'gi'), '<span class="highlight">$1</span>') : param.name;
        const highlightDesc = searchQuery ? param.desc.replace(new RegExp(`(${searchQuery})`, 'gi'), '<span class="highlight">$1</span>') : param.desc;
        const paramId = `${engine}-${param.name}`;

        html += `
          <tr id="${paramId}">
            <td class="param-name"><a href="#${paramId}" class="param-anchor" title="Link to this parameter">#</a>.${highlightName}()</td>
            <td class="param-type">${param.type}</td>
            <td class="param-range">${param.range}</td>
            <td class="param-default">${param.default}</td>
            <td class="param-desc">${highlightDesc}</td>
          </tr>
        `;
      });

      html += '</tbody></table></div>';
    }

    container.innerHTML = html || '<p style="color: #666; text-align: center; padding: 40px;">No parameters found</p>';

    // Handle URL hash for deep linking
    if (window.location.hash) {
      const element = document.getElementById(window.location.hash.slice(1));
      if (element) {
        setTimeout(() => {
          element.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
      }
    }
  }

  // Search input handler with debounce
  let searchTimeout;
  document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      searchQuery = e.target.value.toLowerCase();
      renderParameters();
    }, 150);
  });

  // Filter button handlers
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderParameters();
    });
  });

  // Initial render
  renderParameters();
</script>

</body>
</html>
