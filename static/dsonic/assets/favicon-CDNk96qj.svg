<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc66;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="15" fill="#0a0a0a" stroke="#00ff88" stroke-width="1"/>
  <!-- Drum head (top ellipse) -->
  <ellipse cx="16" cy="10" rx="10" ry="4" fill="none" stroke="url(#drumGrad)" stroke-width="1.5"/>
  <!-- Drum body lines -->
  <line x1="6" y1="10" x2="6" y2="22" stroke="url(#drumGrad)" stroke-width="1.5"/>
  <line x1="26" y1="10" x2="26" y2="22" stroke="url(#drumGrad)" stroke-width="1.5"/>
  <!-- Drum bottom ellipse -->
  <ellipse cx="16" cy="22" rx="10" ry="4" fill="none" stroke="url(#drumGrad)" stroke-width="1.5"/>
  <!-- Sound wave emanating -->
  <path d="M16 6 Q18 4, 16 2" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.8"/>
  <path d="M12 5 Q14 2, 12 0" fill="none" stroke="#00ff88" stroke-width="0.8" opacity="0.5"/>
  <path d="M20 5 Q18 2, 20 0" fill="none" stroke="#00ff88" stroke-width="0.8" opacity="0.5"/>
</svg>
